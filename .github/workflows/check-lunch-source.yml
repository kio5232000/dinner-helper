name: Check official lunch data access
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_lunch_access.py'
      - '.github/workflows/check-lunch-source.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official public site and historical endpoint access
        run: python scripts/check_lunch_access.py
      - name: Publish diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "data: report official lunch source access checks"
            git push
          fi
