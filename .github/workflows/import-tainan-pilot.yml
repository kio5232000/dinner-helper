name: Import Tainan pilot school lunches
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_tainan_pilot.py'
      - '.github/workflows/import-tainan-pilot.yml'
  schedule:
    - cron: '35 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tainan-pilot-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Fetch allowed school public meal pages
        run: python scripts/import_tainan_pilot.py
      - name: Commit validated pilot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lunch data/tainan-pilot-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public Tainan pilot school lunches"
            git push
          fi
