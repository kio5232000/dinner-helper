name: Import Tainan pilot school lunches
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_tainan_pilot.py'
      - 'scripts/build_coverage_summary.py'
      - 'tests/test_lunch_import.py'
      - '.github/workflows/import-tainan-pilot.yml'
  schedule:
    # 06:45: early family planning, check today and tomorrow
    - cron: '45 6 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '45 8 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '15 11 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '35 13 * * 1-5'
      timezone: 'Asia/Taipei'
    # Sunday-Thursday evenings: next school day's preview
    - cron: '15 19 * * 0-4'
      timezone: 'Asia/Taipei'

permissions:
  contents: write

concurrency:
  group: tainan-pilot-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Check lunch parsing against test fixtures
        run: python -m unittest discover -s tests -v
      - name: Fetch and compare publicly posted school menus
        env:
          IMPORT_SCOPE: ${{ github.event_name == 'schedule' && 'auto' || 'both' }}
        run: python scripts/import_tainan_pilot.py --scope "$IMPORT_SCOPE"
      - name: Build coverage and publishing-observation summary
        run: python -m scripts.build_coverage_summary
      - name: Commit validated pilot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tainan-pilot-status.json data/lunch-monitor.json data/coverage-summary.json
          if [ -d data/lunch ]; then git add data/lunch; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: track Tainan school menus and their observed updates"
            # Repository files can change while the public websites are fetched.
            # Rebase on the latest main before pushing; never force-push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push after three non-force retries" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
