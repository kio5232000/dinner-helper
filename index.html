<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f5ec"><title>今晚煮什麼？｜學校午餐與晚餐靈感</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#263a30;background:#f9f5ec}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}main{max-width:700px;margin:auto;padding:20px 17px 90px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:24px;font-weight:850;letter-spacing:-1px}.muted{color:#69776e;font-size:13px}.eyebrow{font-size:12px;color:#428066;font-weight:700;letter-spacing:.05em}.panel{background:#fff;border:1px solid #eee9df;border-radius:23px;padding:20px;margin:16px 0;box-shadow:0 4px 22px #53462c08}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{font-size:12px;background:#e9f5e9;border-radius:24px;color:#26714f;padding:6px 10px;white-space:nowrap}.demo{background:#fff2d7;color:#875c19}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.dish{border:1px solid #edece7;border-radius:17px;overflow:hidden;background:#fff}.visual{height:115px;display:grid;place-items:center;background:linear-gradient(150deg,#f3f5e9,#fff2e2);font-size:53px}.dish .text{padding:12px}.dish strong{display:block;font-size:15px}.dish small{color:#6f7c72}.title{font-size:20px;font-weight:800;margin:0}.note{background:#f3f7ed;padding:14px 16px;border-radius:15px;line-height:1.7;font-size:14px}.primary{border:0;background:#32785d;color:white;border-radius:14px;width:100%;padding:15px;font-weight:750;font-size:16px}.secondary{border:1px solid #dfe7dc;background:#fff;color:#2d6d54;border-radius:12px;padding:10px 14px;font-weight:700}.link{background:transparent;border:0;color:#36795d;font-size:13px;padding:8px}.field{margin:14px 0}label{display:block;margin:0 0 7px;font-size:13px;font-weight:700}select,input{width:100%;padding:12px;border:1px solid #dce0d5;border-radius:11px;background:#fff;font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border:1px solid #e3ebe3;border-radius:16px;padding:15px;margin:13px 0}.result h3{font-size:17px;margin:4px 0}.result p{font-size:14px;line-height:1.6;color:#53685b}.tags{font-size:12px;color:#4d795f}.result details{padding-top:5px;font-size:14px;line-height:1.85}.result summary{font-weight:700;cursor:pointer;color:#32785d}.hidden{display:none!important}.footer{text-align:center;font-size:12px;color:#88948b;margin-top:22px}#error{color:#a33;font-size:13px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body><main>
<header class="head"><div><div class="logo">🍚 今晚煮什麼？</div><div class="muted">從學校午餐，找到晚餐靈感</div></div><button class="link" id="settingsBtn">⚙️ 設定</button></header>
<div class="row"><span class="badge demo">V1 示範資料・尚未串接官方菜單或 AI</span></div>
<section id="setup" class="panel hidden"><div class="eyebrow">只要設定一次，下次會記得</div><h2 class="title">設定孩子的學校</h2>
<div class="field"><label for="city">縣市</label><select id="city"><option>臺南市</option><option>高雄市</option><option>臺北市</option><option>新北市</option><option>臺中市</option><option>桃園市</option><option>其他縣市</option></select></div>
<div class="field"><label for="school">學校名稱（目前自由輸入，僅作為示範標籤）</label><input id="school" placeholder="例如：○○國民小學" maxlength="45"></div>
<div class="two"><div class="field"><label for="adults">大人數量</label><select id="adults"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><div class="field"><label for="kids">小孩數量</label><select id="kids"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div></div>
<div class="two"><div class="field"><label for="minutes">希望料理時間</label><select id="minutes"><option value="15">15 分鐘</option><option value="30" selected>30 分鐘</option><option value="45">45 分鐘</option><option value="60">60 分鐘</option></select></div><div class="field"><label for="budget">預算上限（元）</label><input id="budget" type="number" min="80" max="3000" value="300"></div></div>
<div class="field"><label for="avoid">不吃的食材（逗號分隔；此版非過敏安全篩選）</label><input id="avoid" placeholder="例如：苦瓜、香菜"></div><div id="error"></div><button class="primary" id="save">儲存設定，查看午餐</button></section>
<section id="home" class="hidden">
<div class="panel"><div class="row"><div><div class="eyebrow" id="date"></div><h1 class="title" id="schoolTitle"></h1></div><span class="badge">今日午餐</span></div>
<p class="muted">下列為展示用的模擬菜單，並非該校當日供餐紀錄。</p><div class="grid" id="lunchGrid"></div>
<div class="note" id="hint"></div></div>
<section class="panel"><div class="eyebrow">AI 晚餐靈感（V1 為本地規則模擬）</div><h2 class="title" style="margin:5px 0 8px">今天晚上煮什麼？</h2><p class="muted">參考今天展示的午餐，挑選不同的主要食材與家常料理。</p><button class="primary" id="recommend">✨ 推薦今晚晚餐</button><div id="results"></div><button class="secondary hidden" style="width:100%" id="reshuffle">↻ 不喜歡？換一批</button></section>
</section><div class="footer">示範站｜請勿將示範菜單視為實際學校供餐；食譜與價格未經正式審核。</div>
</main>
<script>
const $=id=>document.getElementById(id),KEY='dinner-helper-v1-school';
const lunchSets=[
[{name:'白米飯',cat:'主食',emoji:'🍚',group:'米飯'},{name:'滷雞腿',cat:'主菜',emoji:'🍗',group:'雞肉'},{name:'炒高麗菜',cat:'蔬菜',emoji:'🥬',group:'葉菜'},{name:'番茄炒蛋',cat:'配菜',emoji:'🍅',group:'雞蛋'},{name:'紫菜湯',cat:'湯品',emoji:'🍲',group:'海藻'}],
[{name:'糙米飯',cat:'主食',emoji:'🍚',group:'米飯'},{name:'香煎魚排',cat:'主菜',emoji:'🐟',group:'魚'},{name:'炒青江菜',cat:'蔬菜',emoji:'🥬',group:'葉菜'},{name:'滷豆干',cat:'配菜',emoji:'🫘',group:'豆腐'},{name:'蘿蔔湯',cat:'湯品',emoji:'🥣',group:'根莖'}],
[{name:'地瓜飯',cat:'主食',emoji:'🍠',group:'米飯'},{name:'肉燥豆腐',cat:'主菜',emoji:'🥘',group:'豬肉'},{name:'炒花椰菜',cat:'蔬菜',emoji:'🥦',group:'花椰菜'},{name:'玉米炒蛋',cat:'配菜',emoji:'🌽',group:'雞蛋'},{name:'冬瓜湯',cat:'湯品',emoji:'🍵',group:'瓜類'}]
];
const recipes=[
{n:'清蒸鱸魚套餐',food:'鱸魚、薑、青蔥、青花菜、白飯',groups:['魚','花椰菜'],t:28,c:260,steps:['鱸魚洗淨，加薑片與蔥段入鍋蒸熟。','青花菜洗淨煮熟或拌炒。','搭配白飯上桌；確實去除魚刺。']},
{n:'肉末蒸豆腐套餐',food:'豬絞肉、嫩豆腐、胡蘿蔔、白飯',groups:['豬肉','豆腐'],t:20,c:200,steps:['絞肉炒香並調味。','加入豆腐蒸至全熟，撒上胡蘿蔔丁。','搭配白飯與一份蔬菜。']},
{n:'番茄牛肉燴飯',food:'牛肉片、番茄、洋蔥、白飯',groups:['牛肉'],t:28,c:290,steps:['洋蔥與番茄炒軟。','加入牛肉片，煮至全熟。','與白飯搭配，另配一份蔬菜。']},
{n:'鮭魚蔬菜飯',food:'鮭魚、南瓜、青菜、白飯',groups:['魚','葉菜'],t:25,c:290,steps:['鮭魚煎或蒸至全熟並去刺。','南瓜蒸軟、青菜炒熟。','搭配白飯盛盤。']},
{n:'雞肉蔬菜燉飯',food:'雞肉、紅蘿蔔、洋蔥、米飯',groups:['雞肉','根莖'],t:30,c:220,steps:['雞肉與蔬菜切小塊。','和米飯、水一起燉煮。','雞肉熟透、米飯軟熟後上桌。']},
{n:'蔬菜蛋炒飯',food:'雞蛋、青江菜、玉米、白飯',groups:['雞蛋','葉菜'],t:15,c:150,steps:['將雞蛋炒至凝固。','加入切碎的蔬菜炒熟。','放入白飯拌炒，適量調味。']},
{n:'豆腐菇菇燴飯',food:'板豆腐、香菇、青菜、白飯',groups:['豆腐','葉菜'],t:22,c:190,steps:['香菇切片、豆腐切塊。','放入鍋中燴煮至熟透。','搭配青菜與白飯。']},
{n:'豬肉白菜湯麵',food:'豬肉片、大白菜、麵條',groups:['豬肉','葉菜'],t:20,c:200,steps:['煮滾湯底，放入白菜。','下麵條及豬肉片煮熟。','確認豬肉熟透即可享用。']}
];
let cfg=null,round=0,lunch=[];
function today(){return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date())}
function dayIndex(){let parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return [...parts].reduce((s,c)=>s+c.charCodeAt(0),0)%lunchSets.length}
function show(){if(!cfg){$('setup').classList.remove('hidden');$('home').classList.add('hidden');$('settingsBtn').classList.add('hidden');return}$('setup').classList.add('hidden');$('home').classList.remove('hidden');$('settingsBtn').classList.remove('hidden');$('date').textContent=today();$('schoolTitle').textContent=cfg.city+' · '+cfg.school;lunch=lunchSets[dayIndex()];$('lunchGrid').replaceChildren(...lunch.map(d=>{let el=document.createElement('div');el.className='dish';let visual=document.createElement('div');visual.className='visual';visual.textContent=d.emoji;let txt=document.createElement('div');txt.className='text';let name=document.createElement('strong');name.textContent=d.name;let cat=document.createElement('small');cat.textContent=d.cat+' · 插圖示意';txt.append(name,cat);el.append(visual,txt);return el}));$('hint').textContent='💡 今日提醒：學校供應菜單不等於孩子實際吃下的食物。晚餐可以考慮和午餐不同的主菜食材，搭配蔬菜及主食。';$('results').replaceChildren();$('reshuffle').classList.add('hidden')}
function configForm(){if(!cfg)return;for(let k of ['city','school','adults','kids','minutes','budget','avoid'])$(k).value=cfg[k]??''}
$('settingsBtn').onclick=()=>{$('home').classList.add('hidden');$('setup').classList.remove('hidden');configForm()};
$('save').onclick=()=>{let school=$('school').value.trim(),budget=Number($('budget').value);if(!school){$('error').textContent='請填寫學校名稱';return}if(!Number.isFinite(budget)||budget<80||budget>3000){$('error').textContent='請設定 80 至 3000 元的預算';return}$('error').textContent='';cfg={city:$('city').value,school,adults:$('adults').value,kids:$('kids').value,minutes:$('minutes').value,budget,avoid:$('avoid').value};try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch{}show()};
function recommend(){if(!cfg)return;const previous=lunch.map(x=>x.group),banned=(cfg.avoid||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean);let matches=recipes.filter(r=>r.t<=Number(cfg.minutes)&&r.c<=Number(cfg.budget)&&!banned.some(a=>(r.food+r.n).includes(a))).map(r=>({...r,repeat:r.groups.filter(g=>previous.includes(g)).length})).sort((a,b)=>a.repeat-b.repeat||a.c-b.c);let chosen=[];for(let x of [...matches.slice(round%Math.max(matches.length,1)),...matches])if(!chosen.some(y=>y.n===x.n)&&chosen.length<3)chosen.push(x);let results=$('results');results.replaceChildren();if(!chosen.length){results.textContent='目前示範食譜沒有符合條件的料理，請在設定中放寬料理時間、預算或排除食材。';$('reshuffle').classList.add('hidden');return}for(let [i,r] of chosen.entries()){let el=document.createElement('div');el.className='result';let title=document.createElement('h3');title.textContent=(i+1)+' · '+r.n;let tags=document.createElement('div');tags.className='tags';tags.textContent='⏱ '+r.t+' 分鐘　·　💰 示範約 NT$'+r.c;let why=document.createElement('p');why.textContent=r.repeat===0?'推薦理由：與示範午餐的主要食材較不重複，增加料理變化。':'推薦理由：符合設定條件，但部分食材與午餐相同。';let details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='查看食材與料理步驟';let list=document.createElement('ol');for(let s of r.steps){let li=document.createElement('li');li.textContent=s;list.append(li)}let material=document.createElement('p');material.textContent='食材：'+r.food+'（示範食譜，份量未經驗證）';details.append(summary,material,list);el.append(title,tags,why,details);results.append(el)}$('reshuffle').classList.remove('hidden')}
$('recommend').onclick=()=>{round=0;recommend()};$('reshuffle').onclick=()=>{round++;recommend()};
try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.school==='string'&&s.school.trim()&&typeof s.city==='string')cfg=s}catch{}show();
</script></body></html>
